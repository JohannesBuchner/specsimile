[bumpversion]
current_version = 0.1.0
commit = True
tag = True

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:snowline/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[flake8]
exclude = docs
extend-ignore = E501,F401,E128,E231,E124,W293,E302,E221,E272,E202,E303,E265,E261,E201

[pycodestyle]
count = false
ignore = W191,W291,W293,E231,E225,E302,E221,E272,E202,E303,E265,E261,E201,W503,W504,E226
max-line-length = 160
statistics = false

[aliases]
# Define setup.py command aliases here
test = pytest


[tool:pytest]
#collect_ignore = ['setup.py']
#addopts = -sxv
#addopts = --junitxml=test-reports/junit.xml  --html=tests/reports/index.html
